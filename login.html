<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Task Management App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Task Management</h1>
            <p>Manage your tasks in one place</p>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    autocomplete="email"
                />
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password (6+ characters)"
                    autocomplete="current-password"
                />
            </div>
            <div id="loginError" class="auth-error" role="alert" aria-live="polite"></div>
            <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="auth-demo-notice">
            Demo app &mdash; any valid email and password (6+ chars) will work.
            This is <strong>not</strong> real authentication.
        </p>

    </div>

</div>

<script src="auth-ui.js"></script>
<script>
    // Redirect to app if already logged in
    if (isAuthenticated()) {
        window.location.href = "index.html";
    }

    function showError(message) {
        const el = document.getElementById("loginError");
        el.textContent = message;
        el.classList.add("visible");
    }

    function clearError() {
        const el = document.getElementById("loginError");
        el.textContent = "";
        el.classList.remove("visible");
    }

    function handleLogin(event) {
        event.preventDefault();
        clearError();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        // Always clear the password field on every login attempt, success or failure
        document.getElementById("loginPassword").value = "";

        const result = loginUI(email, password);

        if (!result.success) {
            showError(result.error);
            return;
        }

        window.location.href = "index.html";
    }
</script>

</body>
</html>
